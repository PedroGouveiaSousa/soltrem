<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17362a">
  <meta name="description" content="Menus de comidas e bebidas do Snack-Bar Restaurante SOLTREM, no Funchal.">
  <title>Menus | SOLTREM</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="viewer.css">
  <script src="menu.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="index.html" aria-label="SOLTREM, início">
        <img src="assets/logotipo.jpg" alt="Snack-Bar Restaurante SOLTREM" width="690" height="352">
      </a>
      <span class="place"><span aria-hidden="true"></span> Funchal · Madeira</span>
    </div>
  </header>

  <main>
    <section class="wrap intro" aria-labelledby="menu-title">
      <h1 id="menu-title">O nosso menu<span aria-hidden="true">.</span></h1>
      <p>Escolhe um menu para consultar.</p>
    </section>

    <nav class="wrap choices" aria-label="Consultar os menus">
      <a class="menu-card" href="assets/comidas.png" data-menu="Comidas">
        <div class="menu-art">
          <img src="assets/comidas-miniatura.jpg" alt="" width="622" height="440">
        </div>
        <div class="card-caption">
          <div>
            <span class="card-name">Comidas</span>
            <span class="card-detail">Sandes, pregos e tostas</span>
          </div>
          <span class="card-arrow"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></span>
        </div>
      </a>
      <a class="menu-card" href="assets/bebidas.png" data-menu="Bebidas">
        <div class="menu-art">
          <img src="assets/bebidas-miniatura.jpg" alt="" width="402" height="440">
        </div>
        <div class="card-caption">
          <div>
            <span class="card-name">Bebidas</span>
            <span class="card-detail">Café, cervejas e mais</span>
          </div>
          <span class="card-arrow"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></span>
        </div>
      </a>
    </nav>
    <div class="wrap">
      <figure class="venue-photo">
        <img src="assets/balcao.jpg" alt="Balcão do SOLTREM no Funchal" width="2048" height="946" loading="lazy">
      </figure>
    </div>
  </main>

  <footer class="wrap contact">
    <div>
      <p class="footer-title">Localização e contacto</p>
      <address>
        <a href="https://www.google.com/maps/search/?api=1&amp;query=R.%20do%20Comboio%201%2C%209050-053%20Funchal%2C%20Portugal">R. do Comboio 1, 9050-053 Funchal, Portugal <span aria-hidden="true">↗</span></a>
        <a href="tel:+351291222123">+351 291 222 123</a>
      </address>
    </div>
    <div>
      <p class="footer-title">Horário</p>
      <dl class="hours">
        <div><dt>Segunda a sexta</dt><dd>07:30–20:30</dd></div>
        <div><dt>Sábado</dt><dd>07:30–14:00</dd></div>
        <div><dt>Domingo</dt><dd>Encerrado</dd></div>
      </dl>
    </div>
  </footer>
</body>
</html>
